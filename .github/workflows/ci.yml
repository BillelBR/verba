name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # the word lists are not in the repository (each keeps its own license); some tests use them
      - name: Download the word lists
        shell: pwsh
        run: ./scripts/fetch-data.ps1

      # the sentence translator (CTranslate2 and oneDNN compiled with CMake: about 7 minutes) is built by the release workflow, not here
      - name: Build
        run: cargo build --workspace --all-targets --exclude verba-translate

      - name: Test
        run: cargo test --workspace --exclude verba-translate
