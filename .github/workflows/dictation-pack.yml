name: Dictation pack

# Builds a dictation pack and publishes it as the files of a release, where the "Dictation" page of Verba downloads it from. Every pack is a
# Whisper small model converted to CTranslate2 with int8 weights (about 250 MB; see scripts/convert-hf-whisper.py and scripts/build-darija-pack.py):
#
#   dictation-ar-v1       Arabic: OpenAI Whisper small (multilingual), Apache-2.0
#   dictation-en-v1       English: OpenAI Whisper small.en, Apache-2.0
#   dictation-darija-v1   Algerian Darija: Whisper small with the LoRA adapter EL-ANKA-Lite (algerian-nlp, MIT) merged in
#
# Run it by pushing a tag with one of those names (the number may grow), or by hand (Actions > Dictation pack > Run workflow, with the tag as the
# input). The catalogue of crates/verba-app/src/dictation.rs holds the size and the SHA-256 of each file: after a run, copy them from SHA256SUMS.txt of the release.

on:
  push:
    tags:
      - "dictation-ar-v*"
      - "dictation-en-v*"
      - "dictation-darija-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Name of the release that holds the pack (dictation-ar-v1, dictation-en-v1 or dictation-darija-v1)"
        default: "dictation-darija-v1"

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the converter
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers==5.24.0" "peft==0.22.0" "ctranslate2==4.9.1" "safetensors==0.8.0" "huggingface_hub==2.4.0" sentencepiece accelerate

      - name: Build the pack
        timeout-minutes: 40
        run: |
          case "$TAG" in
            dictation-darija-*)
              python scripts/build-darija-pack.py out --adapter algerian-nlp/EL-ANKA-Lite --adapter-rev d36d9f940e251359351e38171dda6ae23d25b91a
              printf '%s\n' "Verba dictation pack: Algerian Darija." \
                "Base model: openai/whisper-small, revision 973afd24965f72e36ca33b3055d56a652f456b4d (Apache-2.0)." \
                "Adapter: algerian-nlp/EL-ANKA-Lite, revision d36d9f940e251359351e38171dda6ae23d25b91a (MIT), LoRA merged into the base model." \
                "Changed: merged, converted to CTranslate2 with int8 weights (ctranslate2 4.9.1)." > out/pack/SOURCE.txt ;;
            dictation-ar-*)
              python scripts/convert-hf-whisper.py openai/whisper-small out --revision 973afd24965f72e36ca33b3055d56a652f456b4d
              printf '%s\n' "Verba dictation pack: Arabic." \
                "Model: openai/whisper-small, revision 973afd24965f72e36ca33b3055d56a652f456b4d (Apache-2.0), multilingual, used for Arabic." \
                "Changed: converted to CTranslate2 with int8 weights (ctranslate2 4.9.1)." > out/pack/SOURCE.txt ;;
            dictation-en-*)
              python scripts/convert-hf-whisper.py openai/whisper-small.en out --revision e8727524f962ee844a7319d92be39ac1bd25655a
              printf '%s\n' "Verba dictation pack: English." \
                "Model: openai/whisper-small.en, revision e8727524f962ee844a7319d92be39ac1bd25655a (Apache-2.0), trained on English." \
                "Changed: converted to CTranslate2 with int8 weights (ctranslate2 4.9.1)." > out/pack/SOURCE.txt ;;
            *)
              echo "unknown pack: $TAG"; exit 1 ;;
          esac

      - name: Checksums
        run: |
          cd out/pack
          sha256sum config.json model.bin preprocessor_config.json tokenizer.json vocabulary.json | tee SHA256SUMS.txt
          ls -l

      - name: Publish the pack
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Dictation pack (${{ env.TAG }})
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            out/pack/config.json
            out/pack/model.bin
            out/pack/preprocessor_config.json
            out/pack/tokenizer.json
            out/pack/vocabulary.json
            out/pack/SHA256SUMS.txt
            out/pack/SOURCE.txt
          body: |
            A dictation pack of Verba, downloaded by *Settings > Dictation* (not by hand, and not part of the Verba installer). See `SOURCE.txt` for the model, its revision and its licence, and `SHA256SUMS.txt` for the checksums that Verba checks.
            Accuracy and the way it was measured: docs/ACCURACY.md.
