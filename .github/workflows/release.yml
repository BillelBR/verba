name: Release

# Push a tag such as v0.8.0 and this builds Verba-Setup-<version>.exe and publishes it on the Releases page.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # the tag and the version in Cargo.toml must agree, or the file name and the release would not match
      - name: Check the tag against the version
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?ms)\[workspace\.package\].*?^\s*version\s*=\s*"([^"]+)"') { throw "could not read the version from Cargo.toml" }
          $version = $Matches[1]
          if ($tag -ne "v$version") { throw "tag $tag does not match the version $version in Cargo.toml" }
          # a hyphen in the tag (v0.8.0-beta1) or a 0.x version means "not final yet"
          $pre = $tag.Contains("-") -or $tag.StartsWith("v0.")
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($pre.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download the word lists
        shell: pwsh
        run: ./scripts/fetch-data.ps1

      # The words of real Algerian comments in Arabic letters (Darija), CC BY 4.0. If the download fails the release goes on without them:
      # Darija then has only the words written for Verba.
      - name: Build the list of Algerian words in Arabic letters
        shell: pwsh
        continue-on-error: true
        run: ./scripts/fetch-dz-ar.ps1

      - name: Build the next-word tables
        shell: pwsh
        run: ./scripts/fetch-bigrams.ps1 -Clean

      # The word-translation dictionary: three gzip files of Wiktionary data from kaikki.org (about 660 MB in all) are downloaded (with resume),
      # unpacked as a stream into a small tool (the 3.4 GB of English JSON is never stored) and deleted again. Measured here: 70 seconds with a
      # 35 MB/s download, 20 s of it extracting; the limit below is 25 minutes.
      # If kaikki.org cannot be reached or its files changed, the script stops with an error and so does the release: a release must not be
      # published without the dictionary by accident.
      - name: Build the word-translation dictionary
        shell: pwsh
        timeout-minutes: 25
        run: ./scripts/fetch-dict.ps1

      # Sentence translation. Two parts, both built here so that the installer has them (build-installer.ps1 includes them when they exist
      # and stops if it cannot make them):
      #  - the translator program: CTranslate2 and oneDNN compiled from source with CMake (CMake and the C++ tools are on the image).
      #    Measured on a PC: 7 minutes 23 seconds and about 5 GB of build files. NOT yet measured on a GitHub runner.
      #  - the Arabic <-> English models: downloaded from Hugging Face (Helsinki-NLP/opus-mt-ar-en and -en-ar) and converted with a temporary
      #    Python environment (PyTorch is only needed for the conversion). Measured on a PC: about 2 minutes each.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sentence translator
        shell: pwsh
        timeout-minutes: 45
        run: ./scripts/build-translate.ps1

      # The models come from the release "models-v1" when it exists (run the Models workflow once to make it): the converted files, checked
      # against their checksums, so that this release does not depend on Hugging Face (and on the pull request that holds the corrected
      # Arabic -> English checkpoint) being reachable. Without that release they are downloaded and converted, as before.
      - name: Prepare the translation models
        shell: pwsh
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $done = $false
          New-Item -ItemType Directory -Force models-dl | Out-Null
          gh release download models-v1 --dir models-dl --clobber
          if ($LASTEXITCODE -eq 0) {
            ./scripts/unpack-models.ps1 -From models-dl
            if ($LASTEXITCODE -eq 0) { $done = $true }
          }
          if ($done) {
            Write-Host "translation models: taken from the release models-v1"
          } else {
            Write-Host "translation models: no usable release models-v1, converting from Hugging Face"
            Remove-Item -Recurse -Force models -ErrorAction SilentlyContinue
            ./scripts/fetch-models.ps1
            if ($LASTEXITCODE -ne 0) { throw "the translation models could not be prepared" }
          }

      # Inno Setup 6 is on the windows-latest image; install it only if it is missing
      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          $known = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not ($known | Where-Object { Test-Path $_ })) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Verba ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Verba-Setup-${{ steps.meta.outputs.version }}.exe
            dist/Verba-Setup-${{ steps.meta.outputs.version }}.exe.sha256
