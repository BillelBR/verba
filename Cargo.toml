[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo build` and `cargo test` leave out the sentence translator: it compiles CTranslate2 and oneDNN with CMake (10 minutes, 7 GB).
# Build it on its own with scripts/build-translate.ps1.
default-members = ["crates/verba-app", "crates/verba-core", "crates/verba-local", "crates/verba-win"]
# the spike programs are throw-away experiments with their own build
exclude = ["spike"]

[workspace.package]
version = "0.12.1"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/BillelBR/verba"
