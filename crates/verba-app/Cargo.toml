[package]
name = "verba-app"
version.workspace = true
edition.workspace = true
description = "Verba for Windows: the tray program that shows suggestions while you type"

[[bin]]
name = "verba"
path = "src/main.rs"

[dependencies]
verba-core = { path = "../verba-core" }
verba-local = { path = "../verba-local" }
verba-win = { path = "../verba-win" }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
